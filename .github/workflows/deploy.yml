# Deploy the static site to Vercel with the Vercel CLI (Vercel's own Git integration is off: vercel.json).
#   pull_request -> preview deploy (same-repo PRs only; fork PRs never see the secrets)
#   push to main -> production deploy (https://layerframe.craftedbyk.com)
#
# Security notes (see also ci.yml):
# - Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (repo secrets). They're only passed via env,
#   never interpolated into `run:` and never echoed. Actions masks them in logs.
# - Trigger is `pull_request`, never `pull_request_target`. The job is skipped for fork PRs.
# - No `${{ github.event.* }}` in `run:` steps.
# - Token is read-only and not persisted to .git/config; dependency install scripts are disabled.
# - Harden-Runner blocks egress outside the allowlist (npm + Vercel + GitHub).
# - Actions are pinned to full commit SHAs; the Vercel CLI is pinned by .github/vercel-cli/package-lock.json.
#   Bump them deliberately.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Vercel ${{ github.event_name == 'push' && 'production' || 'preview' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.vercel.com:443
            vercel.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI (pinned by .github/vercel-cli/package-lock.json)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/vercel-cli
          echo "$GITHUB_WORKSPACE/.github/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull project settings
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
